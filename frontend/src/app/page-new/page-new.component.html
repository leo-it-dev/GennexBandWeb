<app-titlebar></app-titlebar>
<app-logo-block></app-logo-block>
<app-video-list id="live-action" class="section"></app-video-list>
<app-about-us id="about-us" class="section"></app-about-us>
<app-calendar-list id="next-events" class="section"></app-calendar-list>
<app-setlist id="setlist" class="section-left"></app-setlist>
<app-booking id="booking" class="section-left-wide"></app-booking>
<app-gallery id="gallery" class="section"></app-gallery>
<app-contact id="contact" class="section"></app-contact>
<app-footer (onPrivacyPolicy)="this.doShowPrivacyPolicy.set(true)" (onImpressum)="this.doShowImpressum.set(true)"></app-footer>

@if (this.loadingOverlay.loadingOverlayVisible()) {
<app-loadingoverlay [videoURL]="this.loadingOverlay.getVideoURL()" [message]="this.loadingOverlay.getMessage()"
	[hasInputText]="this.loadingOverlay.hasInputText" [inputPlaceholder]="this.loadingOverlay.inputPlaceholder"
	[maxInputLength]="this.loadingOverlay.inputMaxLength"
	(inputTextChange)="this.loadingOverlay.inputTextChange($event)"
	[inputMarkedErronous]="this.loadingOverlay.inputInvalid"
	[videoShouldRepeat]="this.loadingOverlay.videoShouldRepeat" [buttons]="this.loadingOverlay.buttons"
	(buttonClicked)="this.loadingOverlay.buttonClicked($event)"
	[hasCaptcha]="this.loadingOverlay.hasCaptcha"></app-loadingoverlay>
}

@if(this.doShowPrivacyPolicy()) {
<app-big-overlay (close)="this.doShowPrivacyPolicy.set(false)">
		<app-privacypolicy></app-privacypolicy>
</app-big-overlay>
}
@if(this.doShowImpressum()) {
<app-big-overlay (close)="this.doShowImpressum.set(false)">
		<app-impressum></app-impressum>
</app-big-overlay>
}
